name: Build macOS

# Builds, signs and notarises the app, and produces the DMG. Reusable so that build.yml (untagged)
# and release.yml (tagged) share one definition — the signing and notarisation steps are the part
# most likely to rot if duplicated.

on:
  workflow_call:
    inputs:
      version:
        description: 'Version string used in the DMG filename.'
        required: true
        type: string
    outputs:
      dmg:
        description: 'Name of the notarised DMG.'
        value: ${{ jobs.build.outputs.dmg }}

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    outputs:
      dmg: ${{ steps.dmg.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Test
        run: swift test

      - name: Build the app bundle
        run: ./Scripts/build-app.sh

      - name: Import the Developer ID certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Sign
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          APP="build/TX500 Utility.app"
          # Hardened runtime is required for notarisation. There are no bundled frameworks or
          # plug-ins to sign first: SwiftPM links the standard library dynamically from the OS, and
          # the only bundled resources are images.
          codesign --force --options runtime --timestamp \
            --sign "Developer ID Application: Michael Richard Garcia ($APPLE_TEAM_ID)" "$APP"
          codesign --verify --verbose=2 "$APP"

      - name: Create, notarise and staple the DMG
        id: dmg
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          DMG="TX500Utility-${{ inputs.version }}-macos.dmg"
          APP="build/TX500 Utility.app"

          mkdir -p dmg-staging
          ditto "$APP" "dmg-staging/TX500 Utility.app"
          ln -s /Applications dmg-staging/Applications
          touch dmg-staging/.metadata_never_index
          sync

          # hdiutil intermittently fails on CI runners under disk pressure; retry rather than
          # failing a whole release for it.
          for attempt in 1 2 3; do
            if hdiutil create -volname "TX500 Utility" -srcfolder dmg-staging \
                 -ov -format UDZO -nocrossdev unsigned.dmg; then
              break
            fi
            echo "hdiutil attempt $attempt failed; retrying"
            sleep 5
          done
          test -f unsigned.dmg || { echo "DMG creation failed after 3 attempts"; exit 1; }

          codesign --force --timestamp \
            --sign "Developer ID Application: Michael Richard Garcia ($APPLE_TEAM_ID)" unsigned.dmg
          mv unsigned.dmg "$DMG"

          mkdir -p ~/private_keys
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > ~/private_keys/AuthKey_$APPLE_API_KEY_ID.p8

          xcrun notarytool submit "$DMG" \
            --key ~/private_keys/AuthKey_$APPLE_API_KEY_ID.p8 \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait --timeout 30m

          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          echo "name=$DMG" >> "$GITHUB_OUTPUT"
          ls -lh "$DMG"

      - name: Verify the signature the way Gatekeeper will
        run: |
          set -euo pipefail
          hdiutil attach "${{ steps.dmg.outputs.name }}" -mountpoint /Volumes/TX500 -nobrowse
          spctl -a -vv "/Volumes/TX500/TX500 Utility.app"
          hdiutil detach /Volumes/TX500

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-${{ inputs.version }}
          path: ${{ steps.dmg.outputs.name }}
          if-no-files-found: error
